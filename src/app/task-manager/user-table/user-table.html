<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Users</h2>
    <button class="btn btn-pink" (click)="onAddNew()">Add new user</button>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Password</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of userService.users; track user.id) {
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.password }}</td>
          <td>
            <button class="btn btn-sm btn-outline-secondary me-2" (click)="onEdit(user.id)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="openDeleteDialog(user.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showDialog) {
  <app-confirm-dialog
    message="Are you sure you want to delete this user?"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
  </app-confirm-dialog>
}
