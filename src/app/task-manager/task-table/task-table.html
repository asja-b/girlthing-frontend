<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tasks</h2>
    <button class="btn btn-pink" (click)="onAddNew()">Add new task</button>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>Title</th>
        <th>Project</th>
        <th>Assigned to</th>
        <th>Status</th>
        <th>Due date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (task of taskService.tasks; track task.id) {
        <tr>
          <td>{{ task.title }}</td>
          <td>{{ task.projectName }}</td>
          <td>{{ getUserName(task.assignedTo) }}</td>
          <td><app-status-badge [status]="task.status"></app-status-badge></td>
          <td>{{ task.dueDate }}</td>
          <td>
            <button class="btn btn-sm btn-outline-secondary me-2" (click)="onEdit(task.id)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="openDeleteDialog(task.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showDialog) {
  <app-confirm-dialog
    message="Are you sure you want to delete this task?"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()">
  </app-confirm-dialog>
}
